name: llm-recommendation
type: microservice
description: FastAPI microservice for LLM-based skill recommendations.
build:
  dockerfile: Dockerfile
run:
  command: uvicorn src.main:app --host 0.0.0.0 --port 8081
  env:
    - name: OPENAI_API_KEY
      required: false
    - name: OPENAI_MODEL
      required: false
ports:
  - 8081
healthcheck:
  path: /health
  interval: 30s
  timeout: 5s
  retries: 3
