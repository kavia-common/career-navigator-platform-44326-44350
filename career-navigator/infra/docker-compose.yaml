version: "3.9"

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15
    container_name: cn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_navigator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  backend-api:
    build:
      context: ../services/backend-api
      dockerfile: Dockerfile
    container_name: cn_backend_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: career_navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Allow local dev frontend at 3000
      CORS_ALLOW_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - appnet

  llm-recommendation:
    build:
      context: ../services/llm-recommendation
      dockerfile: Dockerfile
    container_name: cn_llm_recommendation
    environment:
      # Optional: set this in your shell or .env before `docker compose up`
      # OPENAI_API_KEY: your_api_key_here
      OPENAI_API_KEY:
    ports:
      - "8081:8081"
    networks:
      - appnet

  frontend-dev:
    image: node:18
    container_name: cn_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      # Frontend can read these to call backend/microservice
      REACT_APP_BACKEND_URL: http://localhost:8000
      REACT_APP_RECOMMENDER_URL: http://localhost:8081
      # Common CRA envs (provided for completeness; optional to set)
      REACT_APP_API_BASE: http://localhost:8000
      REACT_APP_FRONTEND_URL: http://localhost:3000
      REACT_APP_WS_URL: ws://localhost:8000
      REACT_APP_NODE_ENV: development
      REACT_APP_NEXT_TELEMETRY_DISABLED: "1"
      REACT_APP_ENABLE_SOURCE_MAPS: "true"
      REACT_APP_PORT: "3000"
      REACT_APP_TRUST_PROXY: "true"
      REACT_APP_LOG_LEVEL: info
      REACT_APP_HEALTHCHECK_PATH: /health
      REACT_APP_FEATURE_FLAGS: ""
      REACT_APP_EXPERIMENTS_ENABLED: "false"
      # Optional: pass-through for local usage if needed by frontend
      REACT_APP_OPENAI_API_KEY:
    volumes:
      - ../../career_navigation_frontend:/app
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend-api
      - llm-recommendation
    networks:
      - appnet
